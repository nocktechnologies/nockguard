# Policy for the GitHub MCP server under Cursor.
#
# Copy it next to your project or to ~/.nockguard/, and point --policy in
# mcp.json at it. Allows every GitHub tool except the three below.
audit:
  # Writes ~/.nockguard/logs/cursor.audit.jsonl, signed with the key from
  # `nockguard keygen --agent cursor`.
  enabled: true

agents:
  cursor:
    mode: allow
    deny:
      # Policy matches tool names, not the `private` argument, so all repo
      # creation is denied. See README.md.
      - "create_repository"
      # A fork of a public repo is public.
      - "fork_repository"
      - "delete_repository"
