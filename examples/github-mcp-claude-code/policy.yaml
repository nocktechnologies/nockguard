# Policy for the GitHub MCP server under Claude Code.
#
# Copy it next to your project or to ~/.nockguard/, and point --policy in
# .mcp.json at it. Allows every GitHub tool except the two below.
audit:
  # Writes ~/.nockguard/logs/claude-code.audit.jsonl, signed with the key from
  # `nockguard keygen --agent claude-code`.
  enabled: true

agents:
  claude-code:
    mode: allow
    deny:
      # Policy matches tool names, not the `private` argument, so all repo
      # creation is denied. See README.md.
      - "create_repository"
      - "delete_repository"
