name: upstream-exit-repro
on:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Repeat final-output regression
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/proxy -run '^TestProxyDeliversOutputWrittenBeforeUpstreamExit$' -count=300 -race -v 2>&1 | tee regression.log
      - name: Count results
        if: always()
        shell: bash
        run: |
          echo "Passes: $(grep -c -- '--- PASS: TestProxyDeliversOutputWrittenBeforeUpstreamExit' regression.log || true)"
          echo "Failures: $(grep -c -- '--- FAIL: TestProxyDeliversOutputWrittenBeforeUpstreamExit' regression.log || true)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: regression.log
