# Local MCP demonstration policy. The example server is in live_client.py.
audit:
  enabled: true
  path: ~/.nockguard/logs/live-demo.jsonl
agents:
  demo:
    allow:
      - "demo_status"
      - "demo_list_notes"
      - "demo_read_note"
      - "demo_usage"
      - "demo_sessions"
    deny:
      - "demo_delete_note"
      - "demo_private_notes"
    validate_input: ["secrets", "sqli"]
    rate_limit:
      max_calls: 5
      window: 1m
  default:
    mode: deny
